openapi: 3.0.3
info:
  title: UNDP Gender Reviewer Version Three
  description: |
    REST API for the UNDP Gender Reviewer document pipeline.
    This API enables Microsoft 365 Copilot to process policy PDFs, extract gender-related provisions using AI, and manage a document processing pipeline across multiple runs.
  version: 1.0.2
  contact:
    name: UNDP Gender Reviewer

servers:
  - url: https://gender-index-production.up.railway.app
    description: Production (Railway)

tags:
  - name: Health
    description: Service health checks
  - name: Pipeline
    description: Gender Reviewer document processing pipeline

paths:
  /health:
    get:
      tags:
        - Health
      operationId: checkPipelineStatus
      summary: Check API health or pipeline status
      description: |
        Dual-purpose endpoint:
        - Without chat_id: Returns service health status (instant response)
        - With chat_id: Returns pipeline job status with bounded long-polling (10-30 second response time)
        
        When polling for pipeline status, this endpoint holds the connection for 10-30 seconds to check if the job completes during that window. If completed, returns full results. If still in progress, returns status "in_progress" with comments "wait", and client should poll again.
      x-ms-summary: Check service health or poll for pipeline job status.
      parameters:
        - name: chat_id
          in: query
          required: false
          schema:
            type: string
          description: Optional chat_id_topic to check pipeline status. Omit for basic health check.
      responses:
        "200":
          description: Health check or pipeline status response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/HealthResponse"
                  - $ref: "#/components/schemas/PipelineStatusResponse"
        "404":
          description: Job not found (when chat_id provided but no job exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/pipeline/analyze:
    post:
      tags:
        - Pipeline
      operationId: executeGenderPipeline
      summary: Start Gender Reviewer document pipeline (async)
      description: |
        Starts the document processing pipeline asynchronously for a specific session identifier (`chat_id_topic`).
        
        **IMPORTANT TIMING**: This endpoint always takes approximately 10 seconds to respond (enforced minimum delay).
        
        The pipeline runs in the background. After receiving the "accepted" response, poll the /health endpoint with the chat_id parameter every 10 seconds to check status and retrieve results when complete.
        
        **Workflow**:
        1. Call this endpoint to start the pipeline (~10s response time)
        2. Wait ~10 seconds
        3. Poll GET /health?chat_id={chat_id_topic} every 10 seconds
        4. When status is "completed", retrieve full results from the polling response
      x-ms-summary: Start async gender analysis pipeline (returns immediately after ~10s, poll /health for results).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenderPipelineRequest"
      responses:
        "202":
          description: Pipeline request accepted and started in background (~10s response time).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenderPipelineAcceptedResponse"
        "400":
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
        service:
          type: string

    GenderPipelineRequest:
      type: object
      required:
        - chat_id_topic
        - run
      properties:
        chat_id_topic:
          type: string
        links:
          type: array
          items:
            type: string
            format: uri
        run:
          type: string
          enum:
            - first
            - rerun
          default: first
        output_schema_hint:
          type: string
          nullable: true
        download_timeout:
          type: integer
          default: 120
          minimum: 30
          maximum: 300

    GenderPipelineResponse:
      type: object
      required:
        - chat_id_topic
        - run
        - ai_extractions
        - documents_processed
        - total_documents
        - undownloadable_links
        - blob_links
      properties:
        chat_id_topic:
          type: string
        run:
          type: string
          enum:
            - first
            - rerun
        ai_extractions:
          type: array
          items:
            type: string
        documents_processed:
          type: integer
        total_documents:
          type: integer
        undownloadable_links:
          type: array
          items:
            $ref: "#/components/schemas/FailedLink"
        blob_links:
          type: array
          items:
            $ref: "#/components/schemas/BlobLink"
        ocr_errors:
          type: array
          items:
            $ref: "#/components/schemas/OCRError"
          default: []

    FailedLink:
      type: object
      required:
        - url
        - reason
      properties:
        url:
          type: string
          format: uri
        reason:
          type: string

    BlobLink:
      type: object
      required:
        - url
        - filename
      properties:
        url:
          type: string
          format: uri
        filename:
          type: string

    OCRError:
      type: object
      required:
        - file
        - url
        - error
      properties:
        file:
          type: string
        url:
          type: string
          format: uri
        error:
          type: string

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

    GenderPipelineAcceptedResponse:
      type: object
      required:
        - status
        - chat_id_topic
        - message
        - poll_interval_seconds
      properties:
        status:
          type: string
          enum:
            - accepted
        chat_id_topic:
          type: string
        message:
          type: string
          description: Instructions to poll /health endpoint for status
        poll_interval_seconds:
          type: integer
          description: Recommended polling interval in seconds (typically 10)

    PipelineStatusResponse:
      type: object
      required:
        - status
        - chat_id_topic
        - comments
      properties:
        status:
          type: string
          enum:
            - pending
            - in_progress
            - completed
            - failed
        chat_id_topic:
          type: string
        comments:
          type: string
          description: Status message (e.g., "wait" for in_progress, or completion message)
        result:
          $ref: "#/components/schemas/GenderPipelineResponse"
          nullable: true
          description: Full pipeline results (only present when status is "completed")
        error:
          type: string
          nullable: true
          description: Error message (only present when status is "failed")