openapi: 3.0.3
info:
  title: UNDP Custom Engine Version Six
  description: |
    Starts the UNDP Gender Reviewer document pipeline asynchronously.
    Use this connection to start pipeline jobs in the background.

    **Required for first run:** `chat_id_topic`, `run: first`, and at least one PDF URL in `links` or `input`.
  version: 2.0.4
  contact:
    name: UNDP Gender Reviewer

servers:
  - url: https://gender-index-production.up.railway.app
    description: Production Environment

tags:
  - name: TriggerJob
    description: Start Gender Reviewer document processing jobs

paths:
  /api/pipeline/analyze:
    post:
      tags:
        - TriggerJob
      operationId: dispatchNewGenderReviewJob
      summary: Start Gender Reviewer document pipeline (async)
      description: |
        Starts the document processing pipeline in the background for a session.

        **Common 400 causes:**
        - Missing or empty `chat_id_topic`
        - `run` is `first` but no PDF URLs provided in `links` or `input`
        - Invalid `run` value (must be exactly `first` or `rerun`)

        After success (`202`), poll the Job Status connection with the same `chat_id_topic`.
      x-ms-summary: Start async gender analysis job; poll Job Status connection for results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenderPipelineRequest"
            example:
              chat_id_topic: "session-8073bdc4"
              run: first
              links:
                - "https://example.org/policy-document.pdf"
      responses:
        "202":
          description: Pipeline job accepted (~10 second response time).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenderPipelineAcceptedResponse"
        "400":
          description: Invalid request (missing chat_id_topic, missing links for first run, or invalid run).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: 'links are required for run="first"'

components:
  schemas:
    GenderPipelineRequest:
      type: object
      required:
        - chat_id_topic
        - run
      properties:
        chat_id_topic:
          type: string
          description: Unique session ID. Required. Use the same value when polling job status.
        links:
          type: array
          items:
            type: string
            format: uri
          description: PDF source URLs to analyze. Required when run is first (at least one URL).
        input:
          oneOf:
            - type: string
              format: uri
            - type: array
              items:
                type: string
                format: uri
          description: Alternative to links — single URL or list of PDF URLs. Used if links is empty.
        run:
          type: string
          enum:
            - first
            - rerun
          default: first
          description: Use first for new document links; rerun to reprocess uploads for this session.
        output_schema_hint:
          type: string
          nullable: true
          description: Optional hint for AI extraction output format.
        download_timeout:
          type: integer
          default: 120
          minimum: 30
          maximum: 300
          description: PDF download timeout in seconds (30–300).

    GenderPipelineAcceptedResponse:
      type: object
      required:
        - status
        - chat_id_topic
        - message
        - poll_interval_seconds
      properties:
        status:
          type: string
          enum:
            - accepted
          description: Job queued successfully. Poll Job Status connection next.
        chat_id_topic:
          type: string
          description: Session ID to pass as chat_id to the Job Status connection.
        message:
          type: string
          description: Next-step instructions for polling job status.
        poll_interval_seconds:
          type: integer
          description: Seconds to wait before first status poll (typically 10).

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Error message explaining why the request was rejected.
